name: Build Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Files and Dependencies
        run: |
          # যদি কোনো কারণে আগের ফাইল থেকে থাকে তা ডিলিট করবে
          rm -rf android capacitor.config.json package.json package-lock.json
          
          # নতুন করে package.json তৈরি করা
          echo '{
            "name": "com.tasbih.app",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^5.0.0",
              "@capacitor/cli": "^5.0.0",
              "@capacitor/core": "^5.0.0"
            }
          }' > package.json
          
          # ডিপেন্ডেন্সি ইনস্টল করা
          npm install

      - name: Initialize Capacitor
        run: |
          # এখানে Capacitor সেটআপ করা হচ্ছে সরাসরি রুট ডিরেক্টরির জন্য
          npx cap init Tasbih com.tasbih.app --web-dir .
          npx cap add android
          npx cap copy

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Tasbih-App-Build
          path: android/app/build/outputs/apk/debug/app-debug.apk
